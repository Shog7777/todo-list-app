<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETM &mdash; Enterprise Task Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

  <!-- Sidebar -->
  <aside class="rail">
    <div class="rail__brand">
      <span class="rail__mark">ETM</span>
      <span class="rail__name">Enterprise Task<br>Manager</span>
    </div>

    <nav class="rail__nav">
      <div class="rail__item rail__item--active">
        <span class="rail__dot"></span> Board
      </div>
    </nav>

    <div class="rail__stats">
      <div class="stat">
        <span class="stat__value" id="stat-total">0</span>
        <span class="stat__label">Total items</span>
      </div>
      <div class="stat">
        <span class="stat__value" id="stat-open">0</span>
        <span class="stat__label">Open</span>
      </div>
      <div class="stat">
        <span class="stat__value" id="stat-done">0</span>
        <span class="stat__label">Done</span>
      </div>
    </div>

    <div class="rail__foot">Sprint 04 &middot; Local workspace</div>
  </aside>

  <!-- Main -->
  <main class="main">

    <header class="topbar">
      <div class="topbar__title">
        <h1>Sprint Board</h1>
        <p>Track deliverables from backlog to done.</p>
      </div>

      <div class="topbar__controls">
        <div class="search">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.6"/><path d="M11.5 11.5L15 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <input type="text" id="search-input" placeholder="Search tickets by keyword&hellip;" autocomplete="off">
        </div>
        <button class="btn btn--primary" id="open-add-modal">
          <span class="btn__plus">+</span> New ticket
        </button>
      </div>
    </header>

    <section class="board" id="board">

      <div class="column" data-status="todo">
        <div class="column__head">
          <span class="column__title"><span class="pip pip--todo"></span>To Do</span>
          <span class="column__count" id="count-todo">0</span>
        </div>
        <div class="column__list" id="list-todo" data-dropzone="todo"></div>
      </div>

      <div class="column" data-status="progress">
        <div class="column__head">
          <span class="column__title"><span class="pip pip--progress"></span>In Progress</span>
          <span class="column__count" id="count-progress">0</span>
        </div>
        <div class="column__list" id="list-progress" data-dropzone="progress"></div>
      </div>

      <div class="column" data-status="done">
        <div class="column__head">
          <span class="column__title"><span class="pip pip--done"></span>Done</span>
          <span class="column__count" id="count-done">0</span>
        </div>
        <div class="column__list" id="list-done" data-dropzone="done"></div>
      </div>

    </section>
  </main>
</div>

<!-- Add / Edit Modal -->
<div class="modal-veil" id="modal-veil">
  <div class="modal">
    <div class="modal__head">
      <h2 id="modal-title">New ticket</h2>
      <button class="modal__close" id="modal-close">&times;</button>
    </div>
    <form id="ticket-form">
      <label class="field">
        <span class="field__label">Description</span>
        <input type="text" id="ticket-text" placeholder="e.g. Draft Q3 stakeholder report" required>
      </label>
      <label class="field">
        <span class="field__label">Priority</span>
        <select id="ticket-priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </label>
      <input type="hidden" id="ticket-id-edit">
      <div class="modal__actions">
        <button type="button" class="btn btn--ghost" id="modal-cancel">Cancel</button>
        <button type="submit" class="btn btn--primary" id="modal-submit">Add ticket</button>
      </div>
    </form>
  </div>
</div>

<!-- Empty search state -->
<template id="empty-template">
  <div class="empty">No tickets here.</div>
</template>

<script src="js/app.js"></script>
</body>
</html>
